server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://localhost:3100/loki/api/v1/push

scrape_configs:
  - job_name: nizam-dotfiles
    static_configs:
      - targets:
          - localhost
        labels:
          job: nizam-dotfiles
          host: nizam-vps
          __path__: /home/vazir/nizam-dotfiles/logs/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            script: script
      - template:
          source: level
          template: '{{ ToLower .Value }}'
      - labels:
          level:
          script: